<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 청주소로초 5학년 체육대회 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');

        :root {
            --primary-blue: #0052D4;
            --primary-white: #ffffff;
            --accent-gold: #FFD700;
            --bg-color: #f0f4f8;
            --sidebar-bg: #1a1c23;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Pretendard', sans-serif; 
            line-height: 1.6;
            overflow-x: hidden;
        }

        #app {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* Sidebar - Default (PC) */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 30px 20px;
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header i { color: var(--accent-gold); }

        .nav-links { list-style: none; flex: 1; padding-top: 20px; }
        .nav-links li {
            padding: 16px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255,255,255,0.6);
            transition: all 0.3s;
        }
        .nav-links li:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-links li.active {
            background: var(--primary-blue);
            color: white;
            border-right: 4px solid var(--accent-gold);
        }

        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        #reset-btn {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(255,118,117,0.1); color: #ff7675;
            border: 1px solid #ff7675; cursor: pointer; font-weight: 600;
        }

        /* Main Content - Default (PC) */
        #main-content {
            flex: 1;
            padding: 40px;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .main-header {
            position: relative;
            height: 280px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: var(--shadow);
        }

        .header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .header-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 40px; color: white;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }

        .header-overlay h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; }

        /* Dashboard Grid */
        .dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }

        .score-card {
            flex: 1;
            min-width: 350px;
            padding: 50px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }
        .score-card:hover { transform: translateY(-5px); }
        .score-card.blue { background: linear-gradient(135deg, #0052D4, #4364F7); color: white; }
        .score-card.white { background: white; color: var(--primary-blue); border: 1px solid #eee; }

        .team-name { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; opacity: 0.9; }
        .total-score { font-size: 5.5rem; font-weight: 800; margin: 15px 0; line-height: 1; }

        .card {
            background: white; border-radius: 24px; padding: 30px;
            margin-bottom: 30px; box-shadow: var(--shadow);
        }

        .table-container { width: 100%; overflow-x: auto; border-radius: 12px; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th { padding: 15px; background: #f8f9fa; border-bottom: 2px solid #eee; text-align: center; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }

        /* --- MOBILE RESPONSIVE (MAX-WIDTH: 800PX) --- */
        @media (max-width: 800px) {
            #app { flex-direction: column !important; }
            #sidebar {
                width: 100% !important;
                height: auto !important;
                flex-direction: column !important;
            }
            .nav-links {
                display: flex !important;
                flex-wrap: wrap !important;
                padding: 0 !important;
            }
            .nav-links li {
                flex: 1 1 33% !important;
                padding: 15px 10px !important;
                justify-content: center !important;
                font-size: 0.9rem !important;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            .nav-links li.active {
                border-right: none !important;
                border-bottom: 4px solid var(--accent-gold) !important;
            }
            #main-content { padding: 20px !important; }
            .main-header { height: 180px !important; }
            .header-overlay h1 { font-size: 1.6rem !important; }
            .score-card { flex: 1 1 100% !important; min-width: 100% !important; padding: 35px 20px !important; }
            .total-score { font-size: 4rem !important; }
            .sidebar-footer { display: none !important; }
            table { min-width: 500px !important; }
        }

        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .btn-primary { background: var(--primary-blue); color: white; }
        .btn-primary:hover { filter: brightness(1.1); transform: scale(1.02); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-trophy"></i>
                <span>체육대회 관리</span>
            </div>
            <ul class="nav-links">
                <li class="active" data-view="dashboard"><i class="fas fa-chart-line"></i> 종합 대시보드</li>
                <li data-view="dodgeball"><i class="fas fa-volleyball-ball"></i> 피구</li>
                <li data-view="plateflip"><i class="fas fa-sync-alt"></i> 판 뒤집기</li>
                <li data-view="tugofwar"><i class="fas fa-people-arrows"></i> 줄다리기</li>
                <li data-view="relay"><i class="fas fa-running"></i> 이어달리기</li>
            </ul>
            <div class="sidebar-footer">
                <button id="reset-btn"><i class="fas fa-undo"></i> 데이터 초기화</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content">
            <header class="main-header">
                <img src="header.png" alt="체육대회 배너" class="header-img" onerror="this.style.display='none'">
                <div class="header-overlay">
                    <h1>2026 청주소로초 5학년 체육대회</h1>
                    <p id="current-time"></p>
                </div>
            </header>

            <section id="view-container">
                <!-- Views will be injected here by app.js -->
            </section>
        </main>
    </div>

    <div id="toast" class="hidden"></div>
    <script src="app.js"></script>
</body>
</html>
